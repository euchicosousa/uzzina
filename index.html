<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>UZZINA</title>

    <!-- Favicon Clássico e Temático -->
    <link
      rel="icon"
      href="/favicon-light.png"
      sizes="32x32"
      type="image/png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/favicon-dark.png"
      sizes="32x32"
      type="image/png"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Flicker Prevention Script - Executa antes da renderização do React -->
    <script>
      (function () {
        try {
          // 1. Recupera o tema (Light/Dark)
          var storedTheme = localStorage.getItem("uzzina-theme");
          var theme = storedTheme;
          if (!theme || theme === "system") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.className = theme;

          // 2. Recupera o índice de cor (Acentuação OKLCH)
          var idx = localStorage.getItem("uzzina-accent-color-index");
          var n = idx !== null && idx !== "" ? parseInt(idx, 10) : 0;

          // Paleta de cores mapeada em OKLCH (12 opções)
          var palette = [
            ["35%", "0.068", "19.34"],
            // CNVT Red
            ["61.91%", "0.143", "147.28"],
            // CNVT Green
            ["56.09%", "0.203", "255.45"],
            // CNVT Blue
            ["61.42%", "0.148", "309.43"],
            // CNVT Pink
            ["69.87%", "0.129", "89.65"],
            // CNVT Yellow
            ["54.18%", "0.169", "283.42"],
            // Purple
            ["48.33%", "0.128", "28.32"],
            // Rust
            ["65.73%", "0.165", "131.78"],
            // Lime
            ["59.69%", "0.156", "185.03"],
            // Teal
            ["79.99%", "0.119", "102.76"],
            // Neon Yellow
            ["57.94%", "0.169", "327.91"],
            // Magenta
            ["44.15%", "0.076", "233.15"], // Deep Indigo
          ];
          var c = palette[n] || palette[0];
          document.documentElement.style.setProperty("--primary-l", c[0]);
          document.documentElement.style.setProperty("--primary-c", c[1]);
          document.documentElement.style.setProperty("--primary-h", c[2]);
        } catch (e) {
          console.error("Theme preload error:", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
