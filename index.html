<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>UZZINA</title>

    <!-- Favicon Clássico e Temático -->
    <link
      rel="icon"
      href="/favicon-light.png"
      sizes="32x32"
      type="image/png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/favicon-dark.png"
      sizes="32x32"
      type="image/png"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Brand web font faces (PP Object Sans) - comentado para uso da fonte sans padrão do sistema
    <link rel="stylesheet" href="/object-sans/object-sans.css" />
    -->

    <!-- Flicker Prevention Script - Executa antes da renderização do React -->
    <script>
      (() => {
        try {
          // 1. Recupera o tema (Light/Dark)
          const storedTheme = localStorage.getItem("uzzina-theme");
          let theme = storedTheme;
          if (!theme || theme === "system") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.className = theme;

          // Public surfaces start with the approved Onix background and text
          // before React paints. Every other variable is written from the data
          // by src/main.tsx (applyPaletteVars) before the first render (DS36).
          const path = window.location.pathname;
          const isPublicSurface =
            path === "/" || path === "/dash" || path.startsWith("/dash/");
          if (isPublicSurface) {
            const publicVars = {
              "--background-override": "oklch(0.96 0.002 200)",
              "--dark-background-override": "oklch(0.2 0.01 250)",
              "--foreground-override": "oklch(0 0 0)",
              "--dark-foreground-override": "oklch(1 0 0)",
            };
            for (const [name, value] of Object.entries(publicVars)) {
              document.documentElement.style.setProperty(name, value);
            }
          }
        } catch (e) {
          console.error("Theme preload error:", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
