<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cores dos temas</title>
    <script>
      // Chrome theme before first paint: follows the system unless data-theme is set.
      (function () {
        var dark = false;
        try {
          dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {}
        document.documentElement.classList.add(dark ? "chrome-d" : "chrome-l");
      })();
    </script>
    <style>
      /* ------------------------------------------------------------------
         Real UZZINA token derivation (copied from app/tailwind.css).
         .tl / .td = edited palette (preview panes and swatches).
         .chrome-l / .chrome-d = the editor's own interface (fixed Ônix),
         so editing a palette never breaks the editor itself.
         ------------------------------------------------------------------ */
      :root {
        --radius: 0.65rem;
        --r-xl: calc(var(--radius) + 4px);
        --r-2xl: calc(var(--radius) * 1.8);
        --r-3xl: calc(var(--radius) * 2.2);
        --font-sans:
          ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji",
          "Segoe UI Emoji";
        --font-mono:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .tl,
      .chrome-l {
        --card: oklch(from var(--background) calc(l + var(--card-l-delta)) c h);
        --popover: oklch(
          from var(--background) calc(l + var(--popover-l-delta)) c h
        );
        --border: oklch(
          from var(--background) calc(l + var(--border-l-delta)) c h
        );
        --input: oklch(
          from var(--background) calc(l + var(--input-l-delta)) c h
        );
        --action: oklch(
          from var(--background) calc(l + var(--action-l-delta)) c h
        );
        --action-hover: oklch(
          from var(--background) calc(l + var(--action-hover-l-delta)) c h
        );
        --secondary: color-mix(in srgb, var(--foreground) 5%, transparent);
        --secondary-foreground: color-mix(
          in srgb,
          var(--foreground) 65%,
          transparent
        );
        --popover-edge: color-mix(in srgb, var(--foreground) 5%, transparent);
        --action-base: var(--action);
        --action-hover-base: var(--action-hover);
        --action-ring: color-mix(
          in srgb,
          var(--action-shadow-color) 5%,
          transparent
        );
        --action-shadow: var(
          --action-shadow-override,
          0 1px 2px 0
            color-mix(in srgb, var(--action-shadow-color) 14%, transparent)
        );
        --action-hover-shadow: var(
          --action-hover-shadow-override,
          0 10px 15px -3px
            color-mix(in srgb, var(--action-shadow-color) 18%, transparent),
          0 4px 6px -4px
            color-mix(in srgb, var(--action-shadow-color) 18%, transparent)
        );
        --error-hue: 16.339;
        --warning-hue: 70;
        --info-hue: 250;
        --luminosity: 0.7;
        --chroma: 0.2;
        --color-error: oklch(0.8 calc(var(--chroma) * 1.1) var(--error-hue));
        --error-foreground: oklch(
          0.6 calc(var(--chroma) * 1.1) var(--error-hue)
        );
        --color-error-background: color-mix(
          in oklab,
          var(--color-error) 13%,
          var(--card)
        );
        --color-warning: oklch(
          calc(var(--luminosity) * 1.56) var(--chroma) var(--warning-hue)
        );
        --warning-foreground: oklch(0.5 var(--chroma) var(--warning-hue));
        --color-warning-background: color-mix(
          in oklab,
          var(--color-warning) 7%,
          var(--card)
        );
        --color-success: oklch(0.508 0.14 163);
        --success-foreground: oklch(0.42 0.14 163);
        --color-success-background: color-mix(
          in oklab,
          var(--color-success) 7%,
          var(--card)
        );
        --color-info: oklch(
          calc(var(--luminosity) * 1.2) var(--chroma) var(--info-hue)
        );
        --info-foreground: oklch(0.5 var(--chroma) var(--info-hue));
        --color-info-background: color-mix(
          in oklab,
          var(--color-info) 7%,
          var(--card)
        );
        --success-strong: oklch(0.596 0.145 163.225);
        --success-strong-hover: oklch(0.508 0.118 165.612);
        --late-rest: 0 1px 2px 0
          color-mix(in srgb, var(--error-foreground) 25%, transparent);
        --late-hover:
          0 10px 15px -3px
            color-mix(in srgb, var(--error-foreground) 30%, transparent),
          0 4px 6px -4px
            color-mix(in srgb, var(--error-foreground) 30%, transparent);
        /* phase-surface / phase-vivid knobs (light) */
        --ps-mix: 7%;
        --ps-mix-h: 12%;
        --ps-ring: 30%;
        --ps-fg-l: 0.35;
        --ps-fg-c: 0.07;
        --ps-sh-l: 0.6;
        --ps-sh-c: 0.15;
        --ps-sh-a: 25%;
        --ps-diffuse-a: 0%;
        --pv-edge: 0.06;
        --pv-top: 45%;
      }

      .td,
      .chrome-d {
        --card: oklch(from var(--background) calc(l + var(--card-l-delta)) c h);
        --popover: oklch(
          from var(--background) calc(l + var(--popover-l-delta)) c h
        );
        --border: oklch(
          from var(--background) calc(l + var(--border-l-delta)) c h
        );
        --input: oklch(
          from var(--background) calc(l + var(--input-l-delta)) c h
        );
        --action: oklch(
          from var(--background) calc(l + var(--action-l-delta)) c h
        );
        --action-hover: oklch(
          from var(--background) calc(l + var(--action-hover-l-delta)) c h
        );
        --secondary: color-mix(in oklch, var(--foreground) 10%, transparent);
        --secondary-foreground: color-mix(
          in srgb,
          var(--foreground) 65%,
          transparent
        );
        --popover-edge: color-mix(in srgb, var(--foreground) 10%, transparent);
        --action-base: var(--action);
        --action-hover-base: var(--action-hover);
        --action-ring: color-mix(
          in srgb,
          var(--action-shadow-color) 20%,
          transparent
        );
        --action-shadow: var(
          --action-shadow-override,
          0 1px 2px 0
            color-mix(in srgb, var(--action-shadow-color) 35%, transparent)
        );
        --action-hover-shadow: var(
          --action-hover-shadow-override,
          0 10px 15px -3px
            color-mix(in srgb, var(--action-shadow-color) 50%, transparent),
          0 4px 6px -4px
            color-mix(in srgb, var(--action-shadow-color) 50%, transparent)
        );
        --error-hue: 16.339;
        --warning-hue: 90;
        --info-hue: 250;
        --luminosity: 0.7;
        --chroma: 0.2;
        --color-error: oklch(
          calc(var(--luminosity) * 1.2305) var(--chroma) var(--error-hue)
        );
        --error-foreground: var(--color-error);
        --color-error-background: color-mix(
          in oklab,
          var(--color-error) 14%,
          var(--card)
        );
        --color-warning: oklch(
          calc(var(--luminosity) * 1.56) var(--chroma) var(--warning-hue)
        );
        --warning-foreground: var(--color-warning);
        --color-warning-background: color-mix(
          in oklab,
          var(--color-warning) 14%,
          var(--card)
        );
        --color-success: oklch(0.65 0.16 163);
        --success-foreground: var(--color-success);
        --color-success-background: color-mix(
          in oklab,
          var(--color-success) 14%,
          var(--card)
        );
        --color-info: oklch(
          calc(var(--luminosity) * 1.2) var(--chroma) var(--info-hue)
        );
        --info-foreground: var(--color-info);
        --color-info-background: color-mix(
          in oklab,
          var(--color-info) 14%,
          var(--card)
        );
        --success-strong: oklch(0.596 0.145 163.225);
        --success-strong-hover: oklch(0.508 0.118 165.612);
        --late-shadow: oklch(from var(--color-error) 0.45 0.18 h);
        --late-rest: 0 1px 2px 0
          color-mix(in srgb, var(--late-shadow) 50%, transparent);
        --late-hover:
          0 10px 15px -3px
            color-mix(in srgb, var(--late-shadow) 60%, transparent),
          0 4px 6px -4px color-mix(in srgb, var(--late-shadow) 60%, transparent);
        --ps-mix: 14%;
        --ps-mix-h: 22%;
        --ps-ring: 55%;
        --ps-fg-l: 0.92;
        --ps-fg-c: 0.06;
        --ps-sh-l: 0.33;
        --ps-sh-c: 0.1;
        --ps-sh-a: 20%;
        --ps-diffuse-a: 63%;
        --pv-edge: 0.14;
        --pv-top: 25%;
      }

      /* Editor chrome: Ônix palette, fixed. */
      .chrome-l {
        --background: oklch(0.96 0.002 200);
        --foreground: oklch(0 0 0);
        --primary: oklch(0 0 0);
        --primary-foreground: oklch(1 0 0);
        --ring: oklch(0 0 0);
        --card-l-delta: -0.02;
        --popover-l-delta: 0.02;
        --input-l-delta: -0.04;
        --border-l-delta: -0.07;
        --action-l-delta: 0.02;
        --action-hover-l-delta: 0.1;
        --shadow-tint: oklch(0.25 0.01 200);
        --shadow-alpha: 10%;
        --action-shadow-color: oklch(0.25 0.01 200);
        --action-top-border: #ffffff;
        color-scheme: light;
      }
      .chrome-d {
        --background: oklch(0.2 0.01 250);
        --foreground: oklch(1 0 0);
        --primary: oklch(1 0 0);
        --primary-foreground: oklch(0 0 0);
        --ring: oklch(1 0 0);
        --card-l-delta: 0.05;
        --popover-l-delta: -0.03;
        --input-l-delta: 0.02;
        --border-l-delta: 0.1;
        --action-l-delta: 0.1;
        --action-hover-l-delta: 0.2;
        --shadow-tint: oklch(0.1 0.01 200);
        --shadow-alpha: 50%;
        --action-shadow-color: oklch(0.1 0.01 200);
        --action-top-border: rgba(255, 255, 255, 0.1);
        color-scheme: dark;
      }
      .tl,
      .td,
      .chrome-l,
      .chrome-d {
        --shadow-lg:
          0 10px 15px -3px
            color-mix(
              in srgb,
              var(--shadow-tint) var(--shadow-alpha),
              transparent
            ),
          0 4px 6px -4px
            color-mix(
              in srgb,
              var(--shadow-tint) var(--shadow-alpha),
              transparent
            );
        --focus-ring: 0 0 0 3px
          color-mix(in oklab, var(--ring) 30%, transparent);
        --focus-border: color-mix(in oklab, var(--ring) 60%, transparent);
      }

      /* Phase utilities (app/tailwind.css, DS11 and DS17), mode knobs above. */
      .phase-surface {
        --phase-fg: oklch(
          from var(--phase-color) var(--ps-fg-l) var(--ps-fg-c) h
        );
        --phase-shadow: oklch(
          from var(--phase-color) var(--ps-sh-l) var(--ps-sh-c) h
        );
        --phase-diffuse: color-mix(
          in srgb,
          oklch(from var(--phase-color) 0.2 0.15 h) var(--ps-diffuse-a),
          transparent
        );
        --foreground: var(--phase-fg);
        --action: color-mix(
          in oklab,
          var(--phase-color) var(--ps-mix),
          var(--action-base)
        );
        --action-hover: color-mix(
          in oklab,
          var(--phase-color) var(--ps-mix-h),
          var(--action-hover-base)
        );
        --action-ring: color-mix(
          in srgb,
          var(--phase-color) calc(var(--ps-ring) * var(--action-relief, 1)),
          transparent
        );
        --action-hover-shadow: var(
          --action-hover-shadow-override,
          0 10px 15px -3px
            color-mix(in srgb, var(--phase-shadow) var(--ps-sh-a), transparent),
          0 4px 6px -4px
            color-mix(in srgb, var(--phase-shadow) var(--ps-sh-a), transparent),
          0 14px 30px -4px var(--phase-diffuse)
        );
      }
      .phase-vivid {
        --vivid-fill: var(--phase-color);
        --vivid-ink: oklch(from var(--phase-color) 0.35 0.07 h);
        --vivid-shadow: oklch(from var(--phase-color) 0.55 0.16 h);
        --foreground: var(--vivid-ink);
        --action: var(--vivid-fill);
        --action-hover: oklch(from var(--vivid-fill) calc(l + 0.04) c h);
        --action-ring: oklch(
          from var(--vivid-fill) calc(l - var(--pv-edge)) c h
        );
        --action-top-border: color-mix(
          in srgb,
          color-mix(in oklab, white var(--pv-top), var(--action))
            calc(var(--action-relief, 1) * 100%),
          transparent
        );
        --action-hover-shadow: var(
          --action-hover-shadow-override,
          0 10px 15px -3px
            color-mix(in srgb, var(--vivid-shadow) 40%, transparent),
          0 4px 6px -4px
            color-mix(in srgb, var(--vivid-shadow) 40%, transparent)
        );
      }
      .phase-vivid.st-hover {
        --action-top-border: color-mix(
          in srgb,
          color-mix(in oklab, white var(--pv-top), var(--action-hover))
            calc(var(--action-relief, 1) * 100%),
          transparent
        );
      }

      /* ------------------------------ Base ------------------------------ */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      [hidden] {
        display: none !important;
      }
      .muted {
        color: var(--secondary-foreground);
      }
      .mono {
        font-family: var(--font-mono);
      }
      svg.i {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ---------------------- Prism-like primitives --------------------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        height: 40px;
        padding: 0 20px;
        border-radius: var(--r-2xl);
        corner-shape: superellipse(1.5);
        border: 1px solid var(--border);
        background: transparent;
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
        transition:
          background-color 0.15s,
          border-color 0.15s,
          box-shadow 0.15s;
        outline: none;
      }
      .btn svg.i {
        opacity: 0.6;
      }
      .btn.sm {
        height: 32px;
        padding: 0 16px;
      }
      .btn.xs {
        height: 24px;
        padding: 0 12px;
        font-size: 12px;
      }
      .btn.has-end {
        padding-right: 12px;
      }
      .btn.sm.has-end {
        padding-right: 8px;
      }
      .btn.has-start {
        padding-left: 12px;
      }
      .btn.sm.has-start {
        padding-left: 8px;
      }
      .btn.icon-sm {
        width: 32px;
        height: 32px;
        padding: 0;
      }
      .btn:disabled {
        opacity: 0.5;
        pointer-events: none;
      }
      .btn:focus-visible,
      .btn.st-focus {
        border-color: var(--focus-border);
        box-shadow: var(--focus-ring);
      }
      .v-default {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-foreground);
      }
      .v-default:hover,
      .v-default.st-hover {
        background: color-mix(in oklab, var(--primary), var(--background) 20%);
        border-color: color-mix(
          in oklab,
          var(--primary),
          var(--background) 20%
        );
      }
      .v-outline:hover,
      .v-outline.st-hover,
      .v-ghost:hover,
      .v-ghost.st-hover {
        background: var(--secondary);
      }
      .v-secondary {
        background: var(--secondary);
        border-color: var(--secondary);
      }
      .v-secondary:hover,
      .v-secondary.st-hover {
        background: color-mix(in oklch, var(--secondary), var(--foreground) 5%);
        border-color: color-mix(
          in oklch,
          var(--secondary),
          var(--foreground) 5%
        );
      }
      .v-ghost,
      .v-ghost-error {
        border-color: transparent;
      }
      .v-ghost-error.st-hover,
      .v-ghost-error:hover {
        background: var(--color-error-background);
        color: var(--error-foreground);
        border-color: var(--color-error);
      }
      .v-error {
        background: var(--color-error-background);
        color: var(--error-foreground);
        border-color: var(--color-error);
      }
      .v-error.st-focus,
      .v-ghost-error.st-focus {
        border-color: var(--color-error);
        box-shadow: 0 0 0 3px var(--color-error-background);
        background: var(--color-error-background);
        color: var(--error-foreground);
      }
      .v-success {
        background: var(--success-strong);
        border-color: var(--success-strong);
        color: #fff;
      }
      .v-success.st-hover,
      .v-success:hover {
        background: var(--success-strong-hover);
      }
      .v-success.st-focus {
        border-color: var(--success-strong);
        box-shadow: 0 0 0 3px
          color-mix(in oklab, var(--success-strong) 30%, transparent);
      }

      .field {
        width: 100%;
        min-width: 0;
        height: 40px;
        padding: 0 20px;
        border-radius: var(--r-2xl);
        corner-shape: superellipse(1.5);
        border: 1px solid transparent;
        background: var(--input);
        font-size: 14px;
        outline: none;
        display: flex;
        align-items: center;
      }
      .field.sm {
        height: 32px;
        padding: 0 16px;
      }
      .field .ph {
        color: color-mix(in srgb, var(--foreground) 40%, transparent);
      }
      .field:focus-visible,
      .field.st-focus {
        border-color: var(--focus-border);
        box-shadow: var(--focus-ring);
      }
      .field.st-invalid {
        background: var(--color-error-background);
        color: var(--error-foreground);
        border-color: var(--color-error);
        box-shadow: 0 0 0 3px var(--color-error-background);
      }
      select.field {
        appearance: none;
        cursor: pointer;
        padding-right: 40px;
        background-image: none;
      }
      .select-wrap {
        position: relative;
        display: inline-flex;
        width: 200px;
      }
      .select-wrap svg.i {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0.6;
        pointer-events: none;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 20px;
        padding: 0 8px;
        border-radius: 999px;
        border: 1px solid transparent;
        font-size: 12px;
        white-space: nowrap;
      }

      /* Joined toggle group, outline variant (DS18 rules). */
      .tgroup {
        display: inline-flex;
      }
      .tgroup .btn {
        border-radius: 0;
      }
      .tgroup .btn:first-child {
        border-radius: var(--r-2xl) 0 0 var(--r-2xl);
      }
      .tgroup .btn:last-child {
        border-radius: 0 var(--r-2xl) var(--r-2xl) 0;
      }
      .tgroup .btn:not(:first-child) {
        margin-left: -1px;
      }
      .tgroup .btn[aria-pressed="true"] {
        background: var(--secondary);
        position: relative;
        z-index: 1;
      }

      .switch {
        position: relative;
        width: 36px;
        height: 20px;
        border-radius: 999px;
        background: var(--secondary);
        border: 0;
        padding: 0;
        cursor: pointer;
        flex-shrink: 0;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        background: var(--background);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.25);
        transition: transform 0.15s;
      }
      .switch[aria-checked="true"] {
        background: var(--primary);
      }
      .switch[aria-checked="true"]::after {
        transform: translateX(16px);
        background: var(--primary-foreground);
      }
      .switch:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }

      /* Prism color slider: 8px gradient track, 16px white-ringed thumb. */
      .cslider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: var(--track, var(--secondary));
        margin: 0;
        cursor: pointer;
        outline: none;
      }
      .cslider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        border: 2px solid #fff;
        background: var(--thumb, var(--background));
        box-shadow:
          0 4px 6px -1px rgb(0 0 0 / 0.2),
          0 2px 4px -2px rgb(0 0 0 / 0.2);
      }
      .cslider::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        border: 2px solid #fff;
        background: var(--thumb, var(--background));
        box-shadow: 0 2px 4px rgb(0 0 0 / 0.3);
      }
      .cslider:focus-visible::-webkit-slider-thumb {
        box-shadow: var(--focus-ring);
      }
      .cslider.plain {
        --track: var(--secondary);
      }
      .cslider.plain::-webkit-slider-thumb {
        width: 20px;
        height: 20px;
        border: 2px solid var(--primary);
        background: var(--background);
      }

      /* ------------------------------ Page ------------------------------ */
      /* The page never scrolls: the app fills the viewport and only the
         preview column and the color list scroll on their own. */
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      .page {
        max-width: 1640px;
        height: 100vh;
        height: 100dvh;
        margin: 0 auto;
        padding: 16px 32px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .head {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 12px 16px;
        min-width: 0;

        const block = (hov, late) => `
          <div class="act block ${hov ? "st-hover" : ""} ${late ? "late" : ""}" data-uses="${late ? "error" : hov ? "action-hover shadow" : "action shadow"}">
            <span class="t">${late ? "Carrossel de outono" : "Campanha Dia dos Pais"}</span>
            <span class="meta"><span>${late ? "Beta Clinic" : "Studio Alpha"}</span><span>${late ? "há 2 dias" : "amanhã, 14:00"}</span></span>
          </div>`;
        return `
        <div class="pane-col">
          <div class="pane-label">${m === "light" ? I.sun + "Claro" : I.moon + "Escuro"}</div>
          <div class="pane ${m === "light" ? "tl" : "td"}" data-uses="background">
            <div class="sec">
              <h3>Superfícies <span>· texto, cartão, menu e campos</span></h3>
              <div class="surf">
                <div class="stack">
                  <div data-uses="foreground"><b style="font-weight:600">Texto principal</b><div class="muted" data-uses="secondary-foreground" style="font-size:13px">Texto secundário a 65%</div></div>
                  <div class="card-demo" data-uses="card border"><b style="font-weight:500">Cartão</b><span class="muted" style="font-size:13px">Fundo do cartão com borda</span></div>
                  <div class="field sm" data-uses="input"><span class="ph">Buscar ação</span></div>
                  <div class="field sm st-focus" data-uses="input ring">Campo em foco</div>
                  <div class="field sm st-invalid" data-uses="input error">Campo com erro</div>
                </div>
                <div class="pop" data-uses="popover shadow">
                  <div class="mitem">${I.copy}Duplicar</div>
                  <div class="mitem st-hover" data-uses="secondary">${I.cal}Mudar data</div>
                  <div class="mitem">${I.plus}Nova ação</div>
                  <div class="mitem" style="color:var(--error-foreground)" data-uses="error">${I.trash}Excluir</div>
                </div>
              </div>
            </div>
            <div class="sec">
              <h3>Cartão de ação <span>· repouso e com o mouse</span></h3>
              <div class="pair">
                <span class="colhead">Repouso</span><span class="colhead">Com o mouse</span>
                ${block(0, 0)}${block(1, 0)}
                <div class="act line" data-uses="action shadow"><span class="dot" style="background:var(--foreground)"></span><span class="t">Roteiro institucional</span><span class="meta">15:30</span></div>
                <div class="act line st-hover" data-uses="action-hover shadow"><span class="dot" style="background:var(--foreground)"></span><span class="t">Roteiro institucional</span><span class="meta">15:30</span></div>
                ${block(0, 1)}${block(1, 1)}
              </div>
            </div>
            <div class="sec">
              <h3>Fases <span>· suave e viva, repouso e mouse</span></h3>
              <div class="phase-grid">
                <span class="colhead"></span><span class="colhead">Suave</span><span class="colhead">Suave · mouse</span><span class="colhead">Viva</span><span class="colhead">Viva · mouse</span>
                ${phases}
              </div>
            </div>
            <div class="sec">
              <h3>Botões <span>· tamanho pequeno</span></h3>
              <div class="btn-grid">
                <span></span>${st.map((s) => `<span class="colhead">${s}</span>`).join("")}
                ${btnRows}
              </div>
            </div>
            <div class="sec">
              <h3>Avisos e prioridades</h3>
              <div class="stack">
                <div class="row-wrap">
                  <span class="badge" style="background:var(--color-info-background);color:var(--info-foreground)" data-uses="info">Informação</span>
                  <span class="badge" style="background:var(--color-success-background);color:var(--color-success)" data-uses="success">Sucesso</span>
                  <span class="badge" style="background:var(--color-warning-background);color:var(--warning-foreground)" data-uses="warning">Atenção</span>
                  <span class="badge" style="background:var(--color-error-background);color:var(--error-foreground)" data-uses="error">Erro</span>
                </div>
                <div class="alert" style="background:var(--color-warning-background);color:var(--warning-foreground);border-color:var(--color-warning)" data-uses="warning">
                  ${I.warn}<div><b>Atenção necessária</b><span>Revise os prazos antes de aprovar.</span></div>
                </div>
                <div class="alert" style="background:var(--color-info-background);color:var(--info-foreground);border-color:var(--color-info)" data-uses="info">
                  ${I.info}<div><b>Atualização disponível</b><span>Há uma nova versão da estratégia.</span></div>
                </div>
                <div class="row-wrap" style="gap:16px">
                  <span class="prio" data-uses="prio-high"><i style="background:var(--priority-high)"></i>Alta</span>
                  <span class="prio" data-uses="prio-medium"><i style="background:var(--priority-medium)"></i>Média</span>
                  <span class="prio" data-uses="prio-low"><i style="background:var(--priority-low)"></i>Baixa</span>
                </div>
              </div>
            </div>
          </div>
        </div>`;
      }
      function renderPanes() {
        const el = document.getElementById("panes");
        el.innerHTML = paneHTML("light") + paneHTML("dark");
        el.dataset.view = view;
        el.querySelectorAll(".pane-col").forEach((col, i) => {
          col.hidden =
            (view === "light" && i === 1) || (view === "dark" && i === 0);
        });
        document.querySelectorAll("[data-view]").forEach((b) => {
          if (b.tagName === "BUTTON")
            b.setAttribute("aria-pressed", String(b.dataset.view === view));
        });
      }

      /* ============================= Inspector ============================= */
      function swatch(row, m) {
        const scope = m === "light" ? "tl" : "td";
        const style = row.styleExtra ? row.styleExtra() : row.sw();
        const small = row.child ? " derived" : "";
        const inner = row.inner || (row.text ? "Aa" : "");
        return `<span class="sw ${scope} ${row.cls || ""}${small}" style="${style}">${inner}</span>`;
      }
      function rowHTML(row) {
        if (row.kind === "toggle") {
          return `<div class="tok locked" data-row="${row.id}" data-uses="${row.uses}">
            <span class="lbl"><b>${row.label}</b><small>${row.hint}</small></span>
            <span class="spanboth"><button class="switch" role="switch" aria-checked="${pal().relief}" aria-label="${row.label}" id="relief"></button></span></div>`;
        }
        const locked = row.kind === "rule";
        const cell = (m) =>
          `<span class="cell">${swatch(row, m)}${row.val ? `<em data-val="${row.id}:${m}">${row.val(m)}</em>` : ""}</span>`;
        const hint = row.hintFn ? row.hintFn() : row.hint;
        const dot =
          row.phase !== undefined
            ? `<span class="mdot" style="background:var(--ph-${draft.phases[row.phase].slug})"></span>`
            : "";
        const tag = locked ? "div" : "button";
        return `<${tag} class="tok ${row.child ? "child" : ""} ${locked ? "locked" : ""}" data-row="${row.id}" data-uses="${row.uses || ""}"
            ${locked ? "" : `aria-expanded="${openRow === row.id}" type="button"`}>
            <span class="lbl"><b>${dot}${row.label}${locked ? I.lock : ""}</b><small data-hint="${row.id}">${hint}</small></span>
            ${cell("light")}${cell("dark")}
          </${tag}>
          ${openRow === row.id ? editorHTML(row) : ""}`;
      }
      function renderInspector() {
        const ins = document.getElementById("inspector");
        const scrollTop = ins.scrollTop;
        ins.innerHTML = GROUPS.map(
          (g) => `
          <section class="grp">
            <div class="grp-h">
              <div><h2>${g.title}</h2><p class="muted">${g.note()}</p></div>
              <span class="mcol" title="Claro">${I.sun}</span><span class="mcol" title="Escuro">${I.moon}</span>
            </div>
            ${g.rule ? `<div class="rule">${g.rule}</div>` : ""}
            ${g.rows.map(rowHTML).join("")}
          </section>`,
        ).join("");
        ins.scrollTop = scrollTop;
        bindInspector();
      }

      /* =============================== Editor ============================== */
      const RANGES = { l: [0, 1, 0.005], c: [0, 0.37, 0.002], h: [0, 360, 1] };
      const NAMES = { l: "Luz", c: "Saturação", h: "Matiz" };
      function trackFor(ch, col) {
        const stops = [];
        const n = ch === "h" ? 12 : 6;
        for (let i = 0; i <= n; i++) {
          const t = i / n;
          const x = { ...col };
          x[ch] = RANGES[ch][0] + (RANGES[ch][1] - RANGES[ch][0]) * t;
          stops.push(css(x));
        }
        return `linear-gradient(to right, ${stops.join(",")})`;
      }
      function colorBlock(row, m) {
        const col = row.get(m) || o(0.97, 0, 0);
        const title = row.single
          ? "Cor da fase"
          : m === "light"
            ? "Claro"
            : "Escuro";
        const outOfGamut = !inGamut(oklchToLinear(col));
        return `<div class="ed-mode" data-mode="${m}">
          <div class="ed-top">${title}
            <input class="field" data-text="${m}" value="${css(col)}" aria-label="${row.label}, ${title}, valor" spellcheck="false" />
          </div>
          ${["l", "c", "h"]
            .map(
              (ch) => `
            <label class="ch"><span>${NAMES[ch]}</span>
              <input type="range" class="cslider" data-ch="${ch}" data-m="${m}" min="${RANGES[ch][0]}" max="${RANGES[ch][1]}" step="${RANGES[ch][2]}" value="${col[ch]}"
                style="--track:${trackFor(ch, col)};--thumb:${css(col)}" aria-label="${NAMES[ch]}, ${title}" />
              <output data-out="${m}-${ch}">${ch === "h" ? Math.round(col.h) + "°" : (+col[ch]).toFixed(3)}</output>
            </label>`,
            )
            .join("")}
          <span class="ed-note warn" data-gamut="${m}" ${outOfGamut ? "" : "hidden"}>${I.warn}Fora do que a tela mostra; o navegador ajusta a cor.</span>
        </div>`;
      }
      function editorHTML(row) {
        if (row.kind === "color") {
          const modes = row.single ? ["light"] : ["light", "dark"];
          return `<div class="editor" data-editor="${row.id}">${modes.map((m) => colorBlock(row, m)).join("")}
            <div><button class="btn xs v-ghost has-end" data-reset="${row.id}" type="button">Restaurar original ${I.reset}</button></div></div>`;
        }
        const isNum = row.kind === "number";
        const min = isNum ? row.min : -0.3,
          max = isNum ? row.max : 0.3,
          step = isNum ? 1 : 0.005;
        return `<div class="editor" data-editor="${row.id}">
          ${["light", "dark"]
            .map(
              (m) => `
            <label class="ch"><span>${m === "light" ? "Claro" : "Escuro"}</span>
              <input type="range" class="cslider plain" data-num="${m}" min="${min}" max="${max}" step="${step}" value="${row.get(m)}" aria-label="${row.label}, ${m === "light" ? "claro" : "escuro"}" />
              <output data-out="${m}-n">${isNum ? row.get(m) + "%" : nf(row.get(m))}</output>
            </label>`,
            )
            .join("")}
          ${isNum ? "" : `<span class="ed-note">${I.info}Quanto a luz do fundo sobe (+) ou desce (−). A cor e a saturação vêm do Fundo.</span>`}
          <div><button class="btn xs v-ghost has-end" data-reset="${row.id}" type="button">Restaurar original ${I.reset}</button></div>
        </div>`;
      }
      function refreshEditor(row) {
        const ed = document.querySelector(`[data-editor="${row.id}"]`);
        if (!ed) return;
        ed.querySelectorAll(".ed-mode").forEach((blk) => {
          const m = blk.dataset.mode,
            col = row.get(m);
          blk.querySelectorAll("input[data-ch]").forEach((inp) => {
            const ch = inp.dataset.ch;
            inp.style.setProperty("--track", trackFor(ch, col));
            inp.style.setProperty("--thumb", css(col));
            if (document.activeElement !== inp) inp.value = col[ch];
            blk.querySelector(`[data-out="${m}-${ch}"]`).textContent =
              ch === "h" ? Math.round(col.h) + "°" : (+col[ch]).toFixed(3);
          });
          const t = blk.querySelector("[data-text]");
          if (document.activeElement !== t) t.value = css(col);
          blk.querySelector("[data-gamut]").hidden = inGamut(
            oklchToLinear(col),
          );
        });
      }
      function parseColor(str) {
        str = str.trim();
        if (/^#?[0-9a-f]{6}$/i.test(str)) return hexToOklch(str);
        const mt = str.match(/oklch\(\s*([\d.]+)%?\s+([\d.]+)\s+([\d.]+)/i);
        if (mt) {
          let l = +mt[1];
          if (str.includes("%") && l > 1) l = l / 100;
          return o(clamp(l, 0, 1), clamp(+mt[2], 0, 0.5), +mt[3] % 360);
        }
        return null;
      }

      /* ============================== Updates ============================== */
      function changed() {
        let n = 0;
        draft.pal.forEach((p, i) => {
          const a = JSON.stringify(p),
            b = JSON.stringify(original.pal[i]);
          if (a !== b) n++;
        });
        if (JSON.stringify(draft.phases) !== JSON.stringify(original.phases))
          n++;
        if (JSON.stringify(draft.prio) !== JSON.stringify(original.prio)) n++;
        return n;
      }
      function afterEdit(row) {
        renderDyn();
        ALL_ROWS.forEach((r) => {
          if (r.val)
            ["light", "dark"].forEach((m) => {
              const el = document.querySelector(`[data-val="${r.id}:${m}"]`);
              if (el) el.textContent = r.val(m);
            });
          if (r.hintFn) {
            const el = document.querySelector(`[data-hint="${r.id}"]`);
            if (el) el.textContent = r.hintFn();
          }
        });
        if (row) refreshEditor(row);
        const n = changed();
        document.getElementById("dirty").textContent = n
          ? n === 1
            ? "1 grupo alterado"
            : n + " grupos alterados"
          : "Nenhuma alteração";
        document.getElementById("discard").disabled = !n;
      }
      function highlight(uses, on) {
        document
          .querySelectorAll(".hl")
          .forEach((e) => e.classList.remove("hl"));
        if (!on || !uses) return;
        const keys = uses.split(" ");
        document.querySelectorAll("#panes [data-uses]").forEach((el) => {
          const own = el.dataset.uses.split(" ");
          if (
            keys.some((k) => own.includes(k)) &&
            !el.classList.contains("pane")
          )
            el.classList.add("hl");
        });
      }
      function bindInspector() {
        const ins = document.getElementById("inspector");
        ins.querySelectorAll(".tok").forEach((t) => {
          t.addEventListener("mouseenter", () =>
            highlight(t.dataset.uses, true),
          );
          t.addEventListener("mouseleave", () => highlight(null, false));
          t.addEventListener("focus", () => highlight(t.dataset.uses, true));
          t.addEventListener("blur", () => highlight(null, false));
          if (t.tagName === "BUTTON")
            t.addEventListener("click", () => {
              openRow = openRow === t.dataset.row ? null : t.dataset.row;
              renderInspector();
              const again = document.querySelector(
                `[data-row="${t.dataset.row}"]`,
              );
              if (again) again.focus({ preventScroll: true });
            });
        });
        const rel = document.getElementById("relief");
        if (rel)
          rel.addEventListener("click", () => {
            pal().relief = !pal().relief;
            rel.setAttribute("aria-checked", String(pal().relief));
            afterEdit();
          });
        const row = ALL_ROWS.find((r) => r.id === openRow);
        if (!row) return;
        const ed = ins.querySelector(`[data-editor="${row.id}"]`);
        ed.querySelectorAll("input[data-ch]").forEach((inp) =>
          inp.addEventListener("input", () => {
            const m = inp.dataset.m;
            const col = { ...(row.get(m) || o(0.97, 0, 0)) };
            col[inp.dataset.ch] = +inp.value;
            row.set(m, col);
            afterEdit(row);
          }),
        );
        ed.querySelectorAll("input[data-text]").forEach((inp) => {
          const commit = () => {
            const col = parseColor(inp.value);
            if (col) {
              row.set(inp.dataset.text, col);
              afterEdit(row);
            } else inp.value = css(row.get(inp.dataset.text));
          };
          inp.addEventListener("change", commit);
          inp.addEventListener("keydown", (e) => e.key === "Enter" && commit());
        });
        ed.querySelectorAll("input[data-num]").forEach((inp) =>
          inp.addEventListener("input", () => {
            const m = inp.dataset.num;
            row.set(m, +(+inp.value).toFixed(3));
            ed.querySelector(`[data-out="${m}-n"]`).textContent =
              row.kind === "number" ? inp.value + "%" : nf(+inp.value);
            afterEdit();
          }),
        );
        ed.querySelector("[data-reset]").addEventListener("click", () => {
          const fresh = clone(original);
          if (row.phase !== undefined)
            draft.phases[row.phase] = fresh.phases[row.phase];
          else if (row.id.startsWith("prio-")) {
            const k = row.id.slice(5);
            draft.prio.light[k] = fresh.prio.light[k];
            draft.prio.dark[k] = fresh.prio.dark[k];
          } else
            ["light", "dark"].forEach((m) =>
              row.set(m, fresh.pal[cur][m][keyOf(row)]),
            );
          renderInspector();
          afterEdit();
        });
      }
      const keyOf = (row) =>
        ({
          bg: "bg",
          fg: "fg",
          primary: "primary",
          primaryFg: "primaryFg",
          ring: "ring",
          shadow: "shadow",
          shadowOpacity: "shadowOpacity",
          card: "cardLDelta",
          popover: "popoverLDelta",
          input: "inputLDelta",
          border: "borderLDelta",
          action: "actionLDelta",
          actionHover: "actionHoverLDelta",
        })[row.id];

      /* =============================== Export ============================== */
      function exportCode() {
        const p = pal();
        const c = (x) =>
          `{ h: ${+(+x.h).toFixed(1)}, c: ${+x.c.toFixed(3)}, l: ${+x.l.toFixed(3)} }`;
        const mode = (d) => `{
    shadowColor: "${css(d.shadow)}",
    shadowOpacity: ${d.shadowOpacity},
    primary: ${c(d.primary)},
    primaryFg: ${c(d.primaryFg)},
    bg: ${c(d.bg)},
    fg: ${c(d.fg)},
    cardLDelta: ${d.cardLDelta},
    borderLDelta: ${d.borderLDelta},
    inputLDelta: ${d.inputLDelta},
    actionLDelta: ${d.actionLDelta},
    actionHoverLDelta: ${d.actionHoverLDelta},
    popoverLDelta: ${d.popoverLDelta},
    ring: ${c(d.ring)},
  }`;
        let out = `{
  id: "${p.id}",
  label: "${p.label}",
  relief: ${p.relief},
  light: ${mode(p.light)},
  dark: ${mode(p.dark)},
},`;
        if (JSON.stringify(draft.phases) !== JSON.stringify(original.phases)) {
          out +=
            "\n\n// PHASES (app/lib/CONSTANTS.ts)\n" +
            draft.phases.map((ph) => `${ph.slug}: "${ph.hex}",`).join("\n");
        }
        return out;
      }
      let toastTimer;
      function toast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("on");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("on"), 2600);
      }

      /* =============================== Wiring ============================== */
      const sel = document.getElementById("palette");
      sel.innerHTML = draft.pal
        .map((p, i) => `<option value="${i}">${p.label}</option>`)
        .join("");
      sel.addEventListener("change", () => {
        cur = +sel.value;
        openRow = null;
        renderInspector();
        afterEdit();
      });
      document.querySelectorAll("button[data-view]").forEach((b) =>
        b.addEventListener("click", () => {
          view = b.dataset.view;
          renderPanes();
        }),
      );
      document.getElementById("discard").addEventListener("click", () => {
        Object.assign(draft, clone(original));
        openRow = null;
        renderPanes();
        renderInspector();
        afterEdit();
        toast("Alterações descartadas.");
      });
      document.getElementById("copy").addEventListener("click", async () => {
        const code = exportCode();
        try {
          await navigator.clipboard.writeText(code);
          toast(`Código da paleta ${pal().label} copiado.`);
        } catch (e) {
          console.log(code);
          toast("Não foi possível copiar; o código está no console.");
        }
      });
      document
        .getElementById("save")
        .addEventListener("click", () =>
          toast("Protótipo: nada é salvo. O destino depende da decisão 1."),
        );
      document.getElementById("chrome-theme").addEventListener("click", () => {
        const root = document.documentElement;
        const dark = root.classList.contains("chrome-d");
        root.classList.toggle("chrome-d", !dark);
        root.classList.toggle("chrome-l", dark);
        root.dataset.theme = dark ? "light" : "dark";
      });

      renderDyn();
      renderPanes();
      renderInspector();
      afterEdit();
    </script>
  </body>
</html>
